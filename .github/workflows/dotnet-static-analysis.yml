name: static-analysis

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  dotnet:
    name: Build .NET solution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build with analyzers
        run: dotnet build --no-restore

      - name: Run .NET tests
        run: dotnet test --no-build

  laravel:
    name: Laravel/PHP quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-8.3-${{ hashFiles('apps/client/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-

      - name: Install Composer dependencies
        working-directory: apps/client
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare Laravel test environment
        working-directory: apps/client
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Validate Composer configuration
        working-directory: apps/client
        run: composer validate --no-check-publish

      - name: Check Laravel formatting
        working-directory: apps/client
        run: vendor/bin/pint --test

      - name: Run Laravel tests
        working-directory: apps/client
        run: php artisan test

  javascript-typescript:
    name: JavaScript/TypeScript quality gates
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: auction
          RABBITMQ_DEFAULT_PASS: change_me_in_local_env
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      RABBITMQ_URL: amqp://auction:change_me_in_local_env@127.0.0.1:5672
      REDIS_URL: redis://127.0.0.1:6379
      LIVE_FEED_TEST_REDIS_URL: redis://127.0.0.1:6379/1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/client/package-lock.json
            apps/live-feed-service/package-lock.json

      - name: Install root tooling
        run: npm ci

      - name: Install live-feed dependencies
        run: npm ci --prefix apps/live-feed-service

      - name: Install client dependencies
        run: npm ci --prefix apps/client

      - name: Check client formatting
        run: npm run format:check --prefix apps/client

      - name: Check live-feed formatting
        run: npm run format:check --prefix apps/live-feed-service

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build JS/TS projects
        run: npm run build

      - name: Test live-feed service
        run: npm test --prefix apps/live-feed-service

      - name: Test client
        run: npm test --prefix apps/client
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'
